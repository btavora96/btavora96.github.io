      <figure class="gallery-item" data-title="Porto Seguro" data-description="Porto Seguro is a branding project for an investment and citizenship fund.&#10;&#10;The identity combines a Portuguese caravel with a sun, creating a visual language centered around movement, direction, and opportunity.&#10;&#10;Circular markers and subtle cartographic references build on these ideas, resulting in a contemporary identity inspired by navigation and the pursuit of new horizons.">

      <figure class="gallery-item" data-title="Sandsavers" data-description="Sandsavers is a concept born from a trip to Southeast Asia, where the amount of waste on the beaches left a lasting impression.&#10;&#10;Inspired by the microscopic textures and forms of sand, I developed the brand identity and designed a digital prototype while exploring UX/UI design.&#10;&#10;The project reimagines beach cleaning as an engaging experience, connecting environmental action with participation, reward, and positive impact.">
        <div class="gallery-media">
