<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Social Media — Projetos</title>
  <link rel="stylesheet" href="category-page.css?v=16" />
</head>
<body>

  <div class="scroll-banner" aria-hidden="true">
    <div class="scroll-banner-track" style="background-image: url('assets/social/banner/social.svg'); --tile-vb-w: 547.07;"></div>
  </div>

  <a class="back-button" href="keychains-demo.html" aria-label="Voltar">
    <span class="back-icon" aria-hidden="true">&times;</span>
  </a>

  <section class="project-grid">
    <div class="grid-inner grid-inner--stack">
      <figure class="gallery-item">
        <img src="assets/social/estoril-riviera.webp" alt="Estoril Riviera" loading="lazy" />
        <figcaption>
          <button type="button" class="gallery-caption">
            <span class="gallery-label">Estoril Riviera</span>
            <span class="gallery-icon" aria-hidden="true">+</span>
          </button>
          <p class="gallery-subtitle">Ver projeto</p>
        </figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="assets/social/rud-jewelry.webp" alt="Rud Jewelry" loading="lazy" />
        <figcaption>
          <button type="button" class="gallery-caption">
            <span class="gallery-label">Rud Jewelry</span>
            <span class="gallery-icon" aria-hidden="true">+</span>
          </button>
          <p class="gallery-subtitle">Ver projeto</p>
        </figcaption>
      </figure>
      <figure class="gallery-item">
        <video src="assets/social/sanjugo.mp4" class="gallery-video" muted loop playsinline preload="none"></video>
        <figcaption>
          <button type="button" class="gallery-caption">
            <span class="gallery-label">Sanjugo</span>
            <span class="gallery-icon" aria-hidden="true">+</span>
          </button>
          <p class="gallery-subtitle">Ver projeto</p>
        </figcaption>
      </figure>
      <figure class="gallery-item">
        <img src="assets/social/stage-35.webp" alt="Stage 35" loading="lazy" />
        <figcaption>
          <button type="button" class="gallery-caption">
            <span class="gallery-label">Stage 35</span>
            <span class="gallery-icon" aria-hidden="true">+</span>
          </button>
          <p class="gallery-subtitle">Ver projeto</p>
        </figcaption>
      </figure>
      <figure class="gallery-item">
        <video src="assets/social/sumol-summer-fest.mp4" class="gallery-video" muted loop playsinline preload="none"></video>
        <figcaption>
          <button type="button" class="gallery-caption">
            <span class="gallery-label">Sumol Summer Fest</span>
            <span class="gallery-icon" aria-hidden="true">+</span>
          </button>
          <p class="gallery-subtitle">Ver projeto</p>
        </figcaption>
      </figure>
    </div>
  </section>

  <script src="category-page.js?v=4"></script>
</body>
</html>
